chnical_rule": "整室审批默认两级，处理人是两个不同且非申请人的获授权账号；提交时保存流程和expires_at快照。now>=expires_at先撤销，不能再通过；审批TTL测试取60分钟，生产默认值待团队确认。 expires_at仅约束未落实的审批/占用确认；已APPROVED不因审批截止再自动撤销。"}, {"id": "P05", "status": "proposal_requires_review", "rule": "建议教室正式进入维修时，由预约模块结束其中所有尚未结束的个人预约，原因记为系统维修并通知用户，不记违约；资源模块不能直接改预约表。整室占用不自动删除，但要显示资源异常并通知。维修恢复时只解除这张工单造成的限制。", "affected": ["S019", "S032", "S034", "S035", "S043", "S052", "S060"], "technical_rule": "维修生效时，全室所有未结束个人预约由预约域按SYSTEM_MAINTENANCE终结并通知，不计违约；资源域不直接改预约表。整室占用不自动释放，申请展示资源异常并通知。恢复只解除该工单限制。"}, {"id": "P06", "status": "proposal_requires_review", "rule": "新建或已分配但未开修的工单，可由报修人或管理员取消。已在维修或待验收的工单，取消前要经过管理员审查和独立安全验收；通过才取消并解除自己的限制，不通过继续维修。维修人不能验收自己的工单。", "affected": ["S054", "S055", "S056", "S071"], "technical_rule": "NEW/ASSIGNED工单可由报修人或管理员取消；IN_PROGRESS/PENDING_ACCEPTANCE取消需管理员审查和独立安全验收，通过才CANCELLED并释放，未通过继续维修。维修人不能验收自己的工单。"}, {"id": "P07", "status": "proposal_requires_review", "rule": "维修期限必须是大于0的分钟数，派单时记住这张工单的截止时间；测试用120分钟。到截止仍未通过独立验收，就上报一级管理员；同一级只记录一次，不自动转派。评价用1至5的整数，可附0至500字文字。", "affected": ["S053", "S054", "S055"], "technical_rule": "维修SLA为正分钟数，派单时快照due_at，测试120分钟；now>=due_at且未完成独立验收时升至一级管理员，同级只记一次且不自动转派。评价为1至5整数，可附0至500字文本。"}, {"id": "P08", "status": "proposal_requires_review", "rule": "统计时先看截至查询时刻，每笔已确认预约实际保留了多久：从开始时间算到预约结束、取消或释放生效、查询时刻中最早的那个时刻；还没开始就结束则算0，重复版本只算一次。预约占用率用其中与可服务时间重叠的座位分钟，除以启用、开放且未维修的总座位分钟，不能再扣掉预约本身。没有容量就显示无可用容量。签到率和违约率只统计查询范围内开始、且已到签到截止的预约；两者共用“已签到数＋未签到违约数”作总数，排除系统维修结束和开始前取消的记录。这些是预约数据统计，不是传感器测到的实际入座率。", "affected": ["S024", "S033", "S064"], "technical_rule": "统计截止asOf时，每笔已确认占用的保留窗为[start_at,min(end_at,取消/释放生效时刻,asOf))，右端早于或等于开始则计0；同一业务的重复版本只计一次。预约占用率分子为M1/M2保留窗与可服务窗口相交的座位分钟，分母为启用且开放且无维修的座位分钟，不扣预约本身；分母0显示无可用容量而非NaN。签到率与违约率按统计区间内start_at且已到签到截止的队列计算，签到率=有签到记录数/(有签到记录数+未签到违约数)，违约率同分母；系统维修终结及开始前取消排除。不把此口径称传感器实际入座率。"}, {"id": "P09", "status": "proposal_requires_review", "rule": "助手可以直接查询。要预约、取消或修改时，先显示目标、时间和会带来的变化，用户确认一次后再执行；信息不清楚先问，不执行修改。重复同一次确认不能多建业务记录。", "affected": ["S068", "S069", "S070", "S071"], "technical_rule": "Agent查询可 <script>
(()=>{
'use strict';
const D=JSON.parse(document.getElementById('spec-data').textContent), nodes=D.specifications, by=new Map(nodes.map(n=>[n.id,n]));
const requirements=new Map(D.requirements.map(q=>[q.id,q])),policies=new Map(D.policies.map(q=>[q.id,q]));
const jump=document.getElementById('jump');
const graph=document.getElementById('graph'),detail=document.getElementById('detail'),owner=document.getElementById('owner'),search=document.getElementById('search'),mode=document.getElementById('mode');
document.querySelector('h1').textContent='任务关系图 · '+D.summary.specs+'项任务 / '+D.summary.scenarios+'个场景';
const colors={a:['#e8efff','#283e64'],b:['#e5f5eb','#244837'],c:['#fff1db','#59472c'],d:['#f0eaff','#473a61'],e:['#ffeaec','#603741'],f:['#ddf3f8','#294e57']};
let scale=.8, selected='',width=1520,height=0;
const esc=s=>String(s).replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));
const deps=n=>mode.value==='development'?n.development_dependencies:n.depends_on;
function layout(){
 const left=new Map(nodes.map(n=>[n.id,new Set(deps(n))])),levels=[];
 while(left.size){const ready=[...left].filter(([,v])=>!v.size).map(([id])=>id).sort();if(!ready.length)throw Error('依赖有环');levels.push(ready);ready.forEach(id=>left.delete(id));left.forEach(v=>ready.forEach(id=>v.delete(id)));}
 const positions=new Map();let y=65;
 levels.forEach((ids,level)=>{const counts={};ids.forEach(id=>{const n=by.get(id),i=counts[n.owner]||0;counts[n.owner]=i+1;positions.set(id,{x:74+'abcdef'.indexOf(n.owner)*240,y:y+i*112,level});});y+=Math.max(...Object.values(counts))*112+55;});
 return {levels,positions,height:y+20};
}
function zoom(){graph.setAttribute('width',String(width*scale));graph.setAttribute('height',String(height*scale));document.getElementById('zoom').textContent=Math.round(scale*100)+'%';}
function render(){
 const L=layout();height=L.height;graph.setAttribute('viewBox',`0 0 ${width} ${height}`);
 let html='<title id="graph-title">任务前后关系图</title><desc id="graph-desc">按负责人分列、按先后分层；点开查看操作和结果。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="var(--line)"/></marker></defs>';
 for(const a of 'abcdef')html+=`<text class="lane" x="${74+'abcdef'.indexOf(a)*240}" y="28">${a} · ${nodes.filter(n=>n.owner===a).length}项任务</text>`;
 L.levels.forEach((ids,i)=>{const p=L.positions.get(ids[0]);html+=`<text class="level" x="12" y="${p.y+20}">L${i}</text>`;});
 nodes.forEach(n=>deps(n).forEach(id=>{const a=L.positions.get(id),b=L.positions.get(n.id),x1=a.x+106,y1=a.y+94,x2=b.x+106,y2=b.y;html+=`<path class="edge ${by.get(id).kind==='contract'?'contract':''}" data-from="${id}" data-to="${n.id}" d="M${x1},${y1} C${x1},${(y1+y2)/2} ${x2},${(y1+y2)/2} ${x2},${y2-3}" marker-end="url(#arrow)"/>`;}));
 nodes.forEach(n=>{const p=L.positions.get(n.id),letters=Array.from(n.title),a=letters.slice(0,13).join(''),b=letters.slice(13,26).join(''),c=letters.slice(26).join('');html+=`<g class="node ${n.scope==='extra'?'extra':''}" data-id="${n.id}" tabindex="0" role="button" aria-label="${esc(n.id+' '+n.title+'，负责人'+n.owner)}" transform="translate(${p.x},${p.y})" style="--nodefill:${colors[n.owner][0]};--nodedark:${colors[n.owner][1]}"><title>${esc(n.title)}</title><rect width="212" height="94" rx="7"/><text class="code" x="12" y="20">${n.id} · ${n.owner}${n.scope==='extra'?' · 附加':''}</text><text x="12" y="41">${esc(a)}</text><text x="12" y="59">${esc(b)}</text><text x="12" y="77">${esc(c)}</text></g>`;});
 graph.innerHTML=html;zoom();graph.querySelectorAll('.node').forEach(el=>{el.addEventListener('click',()=>select(el.dataset.id));el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();select(el.dataset.id);}});});filter();
}
function closure(id,reverse){const found=new Set([id]),todo=[id];while(todo.length){const x=todo.pop(),next=reverse?nodes.filter(n=>deps(n).includes(x)).map(n=>n.id):deps(by.get(x));for(const y of next)if(!found.has(y)){found.add(y);todo.push(y);}}return found;}
function filter(){
 const term=search.value.trim().toLowerCase();let visible=new Set(nodes.filter(n=>(!owner.value||n.owner===owner.value)&&(!term||(n.id+' '+n.title).toLowerCase().includes(term))).map(n=>n.id));
 if(selected){visible=new Set([...closure(selected,false),...closure(selected,true)]);}
 graph.querySelectorAll('.node').forEach(el=>{el.classList.toggle('dim',!visible.has(el.dataset.id));el.classList.toggle('active',Boolean(selected)&&visible.has(el.dataset.id));el.classList.toggle('selected',el.dataset.id===selected);});
 graph.querySelectorAll('.edge').forEach(el=>{const yes=visible.has(el.dataset.from)&&visible.has(el.dataset.to);el.classList.toggle('dim',!yes);el.classList.toggle('active',Boolean(selected)&&yes);});
}
function list(ids){return ids.length?'<ul>'+ids.map(id=>`<li><button type="button" data-select="${id}">${id}</button> ${esc(by.get(id).title)} · ${by.get(id).owner}</li>`).join('')+'</ul>':'<p>无</p>';}
function lines(items,ordered=false){const tag=ordered?'ol':'ul';return `<${tag}>${items.map(x=>`<li>${esc(x)}</li>`).join('')}</${tag}>`;}
function criterion(ref){const [id,index]=ref.split('.AC');return `${ref}：${requirements.get(id).acceptance[Number(index)-1]}`;}
function policyText(ids){return ids.map(id=>{const p=policies.get(id),status=({proposal_requires_review:'待评审',test_fixture_not_production_default:'测试用，不是正式默认值',existing_baseline_design:'沿用现有设计',external_delivery_limit:'外部邮件服务的限制'})[p.status];return `<p><strong>${esc(id)} · ${status}</strong></p><p>${esc(p.rule)}</p><details class="technical"><summary>开发者核对项：原始技术规则</summary><p>${esc(p.technical_rule)}</p></details>`;}).join('');}
function fixtures(){return Object.entries(D.fixtures).map(([key,value])=>`<p><strong>${esc(({clock:'测试时间',accounts:'测试账号',resources:'测试教室和座位',interval:'默认时段',cleanliness:'测试数据要求'})[key]||key)}</strong>：${esc(value)}</p>`).join('');}
function scene(s,index){const raw=s.technical_reference;return `<details class="scene" id="${s.id.toLowerCase().replace('.','')}" ${index===0?'open':''}><summary>${s.id} ${esc(s.title)}</summary><h4>开始前准备</h4>${lines(s.preconditions)}<h4>怎么操作</h4>${lines(s.actions,true)}<h4 class="goal">应该看到什么结果</h4>${lines(s.expected,true)}<h4>这条场景对应的要求</h4>${s.acceptance_refs.length?lines(s.acceptance_refs.map(criterion)):'<p class="note">这里先检查接口的用法，不表示实际业务已经完成。</p>'}${s.policy_refs.length?'<h4>相关规则</h4>'+policyText(s.policy_refs):''}<details class="technical"><summary>开发者核对项：字段、状态和精确约束</summary><p>以下保留改写前的技术描述，供实现和测试时逐项核对。</p><p><strong>原场景名</strong>：${esc(raw.title)}</p><p><strong>原前置条件</strong></p>${lines(raw.preconditions)}<p><strong>原操作要求</strong></p>${lines(raw.actions,true)}<p><strong>原结果与约束</strong></p>${lines(raw.expected,true)}</details></details>`;}
function select(id){
 selected=id;jump.value=id;
 const n=by.get(id),children=nodes.filter(x=>deps(x).includes(id)).map(x=>x.id),kind={contract:'接口约定',product:'页面和业务',baseline:'共用准备工作',integration:'真实服务验证',human:'真人参与',extra:'附加功能'}[n.kind];
 detail.innerHTML=`<h2>${n.id} ${esc(n.title)}</h2><p><span class="tag">负责人 ${n.owner}</span><span class="tag">${n.module}</span><span class="tag">${kind}</span><span class="tag">草案</span></p><p class="note">${esc(n.validation_note)}</p><p class="note">${esc(D.reading_style.page_names)}</p><p><strong>负责内容</strong>：${esc(D.owners[n.owner].domain)}</p><h3>具体场景（${n.scenarios.length}）</h3><div class="scene-actions"><button type="button" data-scenes="open">展开全部场景</button><button type="button" data-scenes="close">收起全部场景</button></div>${n.scenarios.map(scene).join('')}<details class="info-block"><summary>这些场景用哪些测试账号、教室和时间</summary>${fixtures()}</details><h3>还要注意的规则</h3>${n.policy_refs.length?policyText(n.policy_refs):'<p>按场景中列出的要求执行，没有额外规则。</p>'}<h3>还需要的外部条件</h3><p>${esc(n.external_dependencies.map(x=>D.external_labels[x]).join('、')||'无')}</p><h3>按当前视图，先准备这些任务</h3>${list(deps(n))}<h3>之后会用到本任务的工作</h3>${list(children)}<details class="info-block"><summary>怎样才算做完</summary>${lines(['场景结果已经评审，建议规则已确认；暂时做不了的场景说明原因。','必需场景留下实际记录；代码先测后写，故意破坏后测试仍能发现问题；人工和接口任务不伪造业务测试失败。','新页面和状态有本模块的中英文，不修改其他模块内部文件或数据库。','相关测试和构建通过；没实际验证的服务连通和外部条件单独列出。','真人实际验收后才记为已验收，正式提交和合并请求继续按项目流程处理。'])}</details>`;
 detail.querySelectorAll('[data-select]').forEach(b=>b.addEventListener('click',()=>select(b.dataset.select)));
 detail.querySelectorAll('[data-scenes]').forEach(b=>b.addEventListener('click',()=>detail.querySelectorAll('.scene').forEach(s=>{s.open=b.dataset.scenes==='open';})));
 detail.scrollTop=0;filter();
}
function showGuide(){
 selected='';jump.value='';filter();
 detail.innerHTML=`<h2>分工与阅读约定</h2><p>所有任务都是需求草案，不表示代码已经做好或验收通过。</p><p>箭头从先做的任务指向后续任务。接口用法约定后可以独立开发，临时模拟要明确标记；要说整体完成，仍需真实服务和外部条件验证。</p><p>${esc(D.reading_style.page_names)}</p><h3>六人分工</h3>${Object.entries(D.owners).map(([id,o])=>`<details class="info-block"><summary>${id} · ${esc(o.domain)}</summary><p>${esc(o.engineering)}</p><p>${esc(o.baseline_note)}</p><h4>计划由本人维护的文件（评审和授权后才可修改）</h4>${lines(o.planned_paths)}</details>`).join('')}<h3>共用测试准备</h3>${fixtures()}<h3>规则和还需讨论的建议</h3>${D.policies.map(p=>`<details class="info-block"><summary>${esc(p.id)} · ${p.status==='proposal_requires_review'?'待评审':'阅读规则'}</summary>${policyText([p.id])}</details>`).join('')}<p class="note">继续使用TypeScript/Vue 3、Java 21/Spring Boot 4.1.2和PostgreSQL。a至f只是分工代号，不等于真实登录身份或文件修改权限。</p>`;
 detail.scrollTop=0;
}
function showCoverage(){
 selected='';jump.value='';filter();
 const covered=new Map();nodes.forEach(n=>n.scenarios.forEach(s=>s.acceptance_refs.forEach(ref=>{if(!covered.has(ref))covered.set(ref,[]);covered.get(ref).push(s.id);}))); 
 detail.innerHTML=`<h2>要求与场景对照</h2><p>${D.summary.covered_points} / ${D.summary.acceptance_points}条要求已写成场景；这说明文档没有漏项，不代表测试已经通过。</p>${D.requirements.map(q=>`<details class="info-block"><summary>${q.id} ${esc(q.title)}</summary>${q.acceptance.map((text,i)=>{const ref=q.id+'.AC'+(i+1);return `<div class="coverage-item"><p><strong>${ref}</strong> ${esc(text)}</p>${(covered.get(ref)||[]).map(id=>`<button type="button" data-scene="${id}">${id}</button>`).join(' ')}</div>`;}).join('')}</details>`).join('')}<p class="note">ENG-14.AC3按这次确认的6人领域分工理解；原目录的4人安排仍保留历史记录。</p>`;
 detail.querySelectorAll('[data-scene]').forEach(b=>b.addEventListener('click',()=>{const id=b.dataset.scene;select(id.split('.')[0]);const el=document.getElementById(id.toLowerCase().replace('.',''));el.open=true;el.scrollIntoView({block:'nearest'});}));
 detail.scrollTop=0;
}
nodes.forEach(n=>{const option=document.createElement('option');option.value=n.id;option.textContent=n.id+' · '+n.owner+' · '+n.title;jump.append(option);});
jump.addEventListener('change',()=>{if(jump.value)select(jump.value);});
document.getElementById('guide').addEventListener('click',showGuide);document.getElementById('coverage').addEventListener('click',showCoverage);
owner.addEventListener('change',()=>{selected='';jump.value='';filter();});search.addEventListener('input',()=>{selected='';jump.value='';filter();});mode.addEventListener('change',()=>{render();if(selected)select(selected);});
document.getElementById('plus').addEventListener('click',()=>{scale=Math.min(1.6,scale+.1);zoom();});document.getElementById('minus').addEventListener('click',()=>{scale=Math.max(.3,scale-.1);zoom();});document.getElementById('reset').addEventListener('click',()=>{selected='';jump.value='';owner.value='';search.value='';scale=.8;render();detail.innerHTML='<h2>选择一项任务</h2><p>点击任务或使用上方“查看目标”，直接阅读准备情况、操作步骤和结果。</p>';});render();
})();
</script></body></html>
