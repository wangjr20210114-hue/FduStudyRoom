name: Product CI
on:
  push:
    branches: ['**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-package:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: campus_migration_probe
          POSTGRES_USER: module_user
          POSTGRES_PASSWORD: ci-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U module_user -d campus_migration_probe"
          --health-interval 5s --health-timeout 3s --health-retries 20
      mailpit:
        image: axllent/mailpit@sha256:23fe39e81bde596a918000b3135c0f85dc8bb4c9ea6be274b051143f3e300387
        ports: ['127.0.0.1:1025:1025', '127.0.0.1:8025:8025']
        options: >-
          --memory 128m --pids-limit 64
          --health-cmd "/mailpit readyz"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: '**/pom.xml'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Commit description
        run: |
          git show -s --format=%B "$GITHUB_SHA" > /tmp/commit-description.txt
          python3 scripts/check-commit.py /tmp/commit-description.txt
      - name: Prepare isolated PostgreSQL test databases
        env:
          PGPASSWORD: ci-only-password
        run: |
          psql -h 127.0.0.1 -U module_user -d campus_migration_probe -v ON_ERROR_STOP=1 -c 'CREATE DATABASE module_test OWNER module_user'
          psql -h 127.0.0.1 -U module_user -d campus_migration_probe -v ON_ERROR_STOP=1 -c 'CREATE DATABASE campus_buffer_test OWNER module_user'
      - name: Workflow tooling tests
        run: python3 -m unittest discover -s tests/team -v
      - name: Buffer service tests
        env:
          CAMPUS_BUFFER_TEST_DB_URL: jdbc:postgresql://127.0.0.1:5432/campus_buffer_test
          CAMPUS_BUFFER_TEST_DB_USER: module_user
          CAMPUS_BUFFER_TEST_DB_PASSWORD: ci-only-password
        run: sh backend/mvnw -B -f tools/buffer/backend/pom.xml verify
      - name: Frontend tests and build
        working-directory: frontend
        run: |
          npm ci
          npm test -- --maxWorkers=1
          npm run build
      - name: Buffer frontend tests and build
        working-directory: tools/buffer/frontend
        run: |
          npm test
          npm run build
          npm run test:browser
      - uses: actions/upload-artifact@v4
        with:
          name: buffer-web-${{ github.sha }}
          path: tools/buffer/frontend/dist
          retention-days: 7
      - name: Backend tests and build
        working-directory: backend
        env:
          CAMPUS_DB_URL: jdbc:postgresql://127.0.0.1:5432/module_test
          CAMPUS_DB_USER: module_user
          CAMPUS_DB_PASSWORD: ci-only-password
          CAMPUS_TEST_DB_URL: jdbc:postgresql://127.0.0.1:5432/campus_migration_probe
          CAMPUS_TEST_DB_USER: module_user
          CAMPUS_TEST_DB_PASSWORD: ci-only-password
          CAMPUS_TEST_SMTP_HOST: 127.0.0.1
          CAMPUS_TEST_SMTP_PORT: '1025'
          CAMPUS_TEST_MAILPIT_URL: http://127.0.0.1:8025
        run: sh mvnw -B verify
      - name: Package verified outputs
        env:
          RELEASE_BRANCH: ${{ github.ref_name }}
        run: |
          python3 scripts/package-product.py --output /tmp/product.tar.gz --commit "$GITHUB_SHA" --sequence "$GITHUB_RUN_NUMBER" --branch "$RELEASE_BRANCH"
      - uses: actions/upload-artifact@v4
        with:
          name: product-${{ github.sha }}
          path: /tmp/product.tar.gz
          retention-days: 7
  deploy-huawei:
    if: vars.HUAWEI_SITE_READY == 'true'
    needs: verify-package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Verification can run concurrently; only publishing and public checks own the site lock.
    # The receiver's monotonic sequence check also rejects older runs that finish CI later.
    concurrency:
      group: huawei-experience-site
      cancel-in-progress: false
      queue: max
    environment:
      name: huawei-experience
      url: https://studyroom.seatraces.com
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: product-${{ github.sha }}
          path: release
      - name: Update authorized experience site
        env:
          DEPLOY_KEY: ${{ secrets.HUAWEI_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.HUAWEI_KNOWN_HOSTS }}
        run: |
          test -n "$DEPLOY_KEY"
          test -n "$KNOWN_HOSTS"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/huawei
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/huawei ~/.ssh/known_hosts
          trap 'rm -f ~/.ssh/huawei' EXIT
          ssh -T -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 -i ~/.ssh/huawei -p 22 fdu-deploy@119.3.126.218 deploy < release/product.tar.gz > /tmp/deploy-result.json
      - name: Verify public HTTPS and source version
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
          EXPECTED_SEQUENCE: ${{ github.run_number }}
        run: |
          python3 scripts/verify-deployment.py --receiver-result /tmp/deploy-result.json --commit "$EXPECTED_COMMIT" --sequence "$EXPECTED_SEQUENCE"
