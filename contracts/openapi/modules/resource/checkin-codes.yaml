openapi: 3.0.3
info:
  title: Resource daily check-in codes / 教室每日签到码
  version: 1.0.0
paths:
  /api/resources/rooms/{roomId}/checkin-code:
    get:
      summary: Display current Shanghai-date code; requires resource:checkin-codes:read
      description: Cookie authentication. Cache-Control no-store. Only enabled persistent rooms. UTC server date is not used.
      parameters:
        - $ref: '#/components/parameters/RoomId'
      responses:
        '200':
          description: Current display code
          content:
            application/json:
              schema:
                type: object
                required: [roomId, roomName, date, code]
                properties:
                  roomId: {type: string, format: uuid}
                  roomName: {type: string}
                  date: {type: string, format: date}
                  code: {type: string, pattern: '^[0-9]{6}$'}
        '401': {description: Unauthenticated}
        '403': {description: Missing display permission}
        '404': {description: ROOM_NOT_FOUND}
        '409': {description: ROOM_DISABLED}
        '503': {description: CHECKIN_CODE_UNAVAILABLE}
  /api/resources/rooms/{roomId}:
    get:
      summary: Room details; requires resource:rooms:read; never includes check-in code
      parameters:
        - $ref: '#/components/parameters/RoomId'
      responses:
        '200': {description: 'id, code (room number), name, capacity, enabled; no checkinCode/checkinDate'}
        '401': {description: Unauthenticated}
        '403': {description: Missing room-read permission}
        '404': {description: ROOM_NOT_FOUND}
  /internal/resources/checkin-codes/verify:
    post:
      summary: Verify room/date/code using trusted service credentials
      description: Exact internal path accepts X-Service-Key; ordinary Cookie is not a service credential. No user CSRF token required. Does not issue or disclose a code.
      security: [{ServiceKey: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [roomId, date, code]
              properties:
                roomId: {type: string, format: uuid}
                date: {type: string, format: date}
                code: {type: string, pattern: '^[0-9]{6}$'}
      responses:
        '200':
          description: false for old date, wrong room or wrong code
          content:
            application/json:
              schema:
                type: object
                required: [valid]
                properties:
                  valid: {type: boolean}
        '400': {description: INVALID_REQUEST}
        '401': {description: SERVICE_AUTHENTICATION_REQUIRED}
        '404': {description: ROOM_NOT_FOUND}
        '409': {description: ROOM_DISABLED}
components:
  parameters:
    RoomId:
      name: roomId
      in: path
      required: true
      schema: {type: string, format: uuid}
  securitySchemes:
    ServiceKey:
      type: apiKey
      in: header
      name: X-Service-Key
