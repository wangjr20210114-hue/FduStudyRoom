openapi: 3.1.0
info:
  title: FduStudyRoom Identity API
  version: 0.2.0
  description: |
    普通账号密码登录与开放注册。注册固定为 USER，不接受客户端指定角色。
    成功响应直接返回 JSON，失败返回 Error；不验证学校身份。
    生产 Cookie 为 __Host-FDU_SESSION；local profile 回环 HTTP 使用 FDU_SESSION。
    写操作先 GET /api/auth/csrf，携带响应中的 headerName/token；
    登录及退出后重新获取 CSRF 令牌。跨源 CORS 未开放。
servers:
  - url: /
security:
  - SessionCookie: []
paths:
  /health:
    get:
      security: []
      responses:
        '200':
          description: 服务进程已启动，数据库就绪由身份接口另行确认
  /api/auth/config:
    get:
      security: []
      responses:
        '200':
          description: 当前认证模式及可用性
          content:
            application/json:
              schema:
                type: object
                required: [mode, available, registrationOpen]
                properties:
                  mode: {type: string, const: password}
                  available: {type: boolean, const: true}
                  registrationOpen: {type: boolean, const: true}
  /api/auth/csrf:
    get:
      security: []
      responses:
        '200':
          description: 设置 HttpOnly CSRF Cookie，并返回掩码后的提交令牌
          content:
            application/json:
              schema:
                type: object
                required: [headerName, token]
                properties:
                  headerName: {type: string, const: X-XSRF-TOKEN}
                  token: {type: string}
  /api/auth/login:
    post:
      security:
        - CsrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Credentials'}
      responses:
        '200':
          description: 验证账号密码并设置 HttpOnly 会话 Cookie
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CurrentUser'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /api/auth/register:
    post:
      security:
        - CsrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Credentials'}
      responses:
        '201':
          description: 创建 USER 并设置 HttpOnly 会话 Cookie；显示名称初始为规范账号
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CurrentUser'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /api/auth/me:
    get:
      responses:
        '200':
          description: 实时读取账号状态、角色及权限
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CurrentUser'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /api/auth/logout:
    post:
      security:
        - SessionCookie: []
          CsrfHeader: []
      responses:
        '204':
          description: 递增 auth_version，使本系统所有设备旧凭据失效，清除登录与 CSRF Cookie
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
  /api/admin/roles:
    get:
      responses:
        '200':
          description: 具有 identity:users:read 权限时返回角色
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, code, name, enabled]
                  properties:
                    id: {type: string, format: uuid}
                    code: {type: string}
                    name: {type: string}
                    enabled: {type: boolean}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
  /api/admin/users:
    get:
      responses:
        '200':
          description: 具有 identity:users:read 权限时按登录名排序返回前 100 个账号；分页在用户管理模块扩展
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, loginName, displayName, roleId, role, enabled, authVersion]
                  properties:
                    id: {type: string, format: uuid}
                    loginName: {type: string}
                    displayName: {type: string}
                    roleId: {type: string, format: uuid}
                    role: {type: string}
                    enabled: {type: boolean}
                    authVersion: {type: integer, minimum: 1}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
  /api/admin/users/{id}/access:
    patch:
      security:
        - SessionCookie: []
          CsrfHeader: []
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [roleId, enabled, expectedAuthVersion]
              properties:
                roleId: {type: string, format: uuid}
                enabled: {type: boolean}
                expectedAuthVersion: {type: integer, minimum: 1}
      responses:
        '204':
          description: 具有 identity:users:update 权限时变更角色/启用状态并递增 auth_version；无密码旧账号不能通过此接口启用
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /internal/auth/introspect:
    post:
      description: 仅供后续流程服务服务端调用，校验最新账号状态；不使用浏览器 Cookie
      security:
        - ServiceKey: []
          BearerToken: []
      responses:
        '200':
          description: 当前仍有效的身份
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CurrentUser'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
components:
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: FDU_SESSION
      description: 生产改为 __Host-FDU_SESSION，Secure、HttpOnly、SameSite=Lax；不由前端读取
    CsrfHeader:
      type: apiKey
      in: header
      name: X-XSRF-TOKEN
    ServiceKey:
      type: apiKey
      in: header
      name: X-Service-Key
    BearerToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Credentials:
      type: object
      additionalProperties: false
      required: [loginName, password]
      properties:
        loginName:
          type: string
          minLength: 3
          maxLength: 128
          description: 原始请求最多 128 字符；后端去首尾空格转小写后须为 3—32 位，匹配 [a-z0-9][a-z0-9_.-]{2,31}。本地账号大小写不重复
        password:
          type: string
          format: password
          writeOnly: true
          minLength: 8
          maxLength: 64
          description: 不去除空格，不得全为空白；长度按 Java 字符串长度计算。不符合要求时返回 400 / INVALID_PASSWORD，不回显密码
    CurrentUser:
      type: object
      required: [id, loginName, displayName, role, permissions, authVersion, profileIncomplete]
      properties:
        id: {type: string, format: uuid}
        loginName: {type: string}
        displayName: {type: string}
        role: {type: string}
        permissions: {type: array, uniqueItems: true, items: {type: string}}
        authVersion: {type: integer, minimum: 1}
        profileIncomplete: {type: boolean}
    Error:
      type: object
      required: [code, message, traceId]
      properties:
        code: {type: string}
        message: {type: string}
        traceId: {type: string, format: uuid}
  responses:
    Error:
      description: 安全的公共错误；X-Request-Id 与 traceId 一致，原始异常不返回
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
